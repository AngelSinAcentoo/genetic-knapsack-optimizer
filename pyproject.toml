[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genetic-knapsack-optimizer"
version = "1.0.0"
description = "Reproducible genetic algorithm for a bounded integer knapsack"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]
